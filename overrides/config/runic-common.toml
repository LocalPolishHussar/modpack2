[enchant_blacklist]
	#When true, all enchantments are treated as blacklisted
	disable_all = false
	#Enchantments disabled entirely
	blacklisted = []

[loot]
	#Enchantment ids exempt from RUNIC's enchantment blacklist and stripping. Their enchanted books are also kept by RUNIC's loot filter; books with any unlisted enchantment are still removed.
	enchanted_book_whitelist = []
	#When true, RUNIC loot injection and enchanted-book stripping are disabled
	disable_runic_loot = false
	removed_etchings_enabled = true
	# Default: 60
	# Range: > 0
	common_rune_weight = 60
	# Default: 35
	# Range: > 0
	uncommon_rune_weight = 35
	# Default: 18
	# Range: > 0
	rare_rune_weight = 18
	# Default: 8
	# Range: > 0
	epic_rune_weight = 8
	# Default: 3
	# Range: > 0
	legendary_rune_weight = 3
	# Default: 1
	# Range: > 0
	mythic_rune_weight = 1
	# Default: 4
	# Range: > 0
	loot_only_etching_weight = 4
	# Default: 2
	# Range: > 0
	relic_weight = 2

[mechanics]
	#When true, rune slots are ignored and no longer limit applying runes or etchings
	disable_rune_slots = false
	#When true, stat rune application is no longer clamped by stat caps
	disable_stat_caps = false

[crafting]
	#When true, the etching table cannot craft etchings or inscriptions
	disable_etching_crafting = false

[enhancement_blacklist]
	#Disabled runic stat ids
	stats = []

